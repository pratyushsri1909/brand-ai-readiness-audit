<svg viewBox="0 0 1000 200" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="200" fill="#0f172a" rx="12"/>

  <!-- nodes -->
  <g font-size="13" font-weight="600">
    <!-- Website -->
    <rect x="20" y="75" width="120" height="50" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="80" y="105" fill="#e2e8f0" text-anchor="middle">Website</text>

    <line x1="140" y1="100" x2="182" y2="100" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Discovery -->
    <rect x="184" y="75" width="130" height="50" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="249" y="105" fill="#e2e8f0" text-anchor="middle">Discovery</text>

    <line x1="314" y1="100" x2="356" y2="100" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Access -->
    <rect x="358" y="75" width="120" height="50" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="418" y="105" fill="#e2e8f0" text-anchor="middle">Access</text>

    <line x1="478" y1="100" x2="520" y2="100" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Understanding -->
    <rect x="522" y="75" width="150" height="50" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="597" y="105" fill="#e2e8f0" text-anchor="middle">Understanding</text>

    <line x1="672" y1="100" x2="714" y2="100" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Verification -->
    <rect x="716" y="75" width="130" height="50" rx="8" fill="#1e293b" stroke="#f472b6" stroke-width="1.5"/>
    <text x="781" y="105" fill="#e2e8f0" text-anchor="middle">Verification</text>

    <line x1="846" y1="100" x2="888" y2="100" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Agent Ready -->
    <rect x="890" y="65" width="95" height="70" rx="8" fill="#052e1a" stroke="#4ade80" stroke-width="2"/>
    <text x="937" y="97" fill="#4ade80" text-anchor="middle" font-size="12">Agent</text>
    <text x="937" y="113" fill="#4ade80" text-anchor="middle" font-size="12">Ready</text>
  </g>

  <text x="500" y="30" fill="#f1f5f9" text-anchor="middle" font-size="18" font-weight="700">Can an AI system discover, access, understand, and verify your site?</text>
  <text x="500" y="175" fill="#64748b" text-anchor="middle" font-size="11">Brand AI-Readiness Audit traces this exact path, deterministically, for every audited page.</text>
</svg>
