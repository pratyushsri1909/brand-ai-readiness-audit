<svg viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="900" height="640" fill="#0b1220" rx="12"/>
  <text x="450" y="34" fill="#f1f5f9" text-anchor="middle" font-size="16" font-weight="700">Fail-Closed Request Path</text>

  <!-- steps -->
  <g font-size="12.5">
    <!-- 1 -->
    <rect x="250" y="55" width="400" height="42" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="450" y="81" fill="#e2e8f0" text-anchor="middle">1. URL scheme + host validation (http/https only)</text>
    <line x1="450" y1="97" x2="450" y2="122" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow2)"/>

    <!-- 2 -->
    <rect x="200" y="124" width="500" height="42" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="450" y="150" fill="#e2e8f0" text-anchor="middle">2. DNS A/AAAA resolution (decimal / hex / octal / IPv4-mapped IPv6 aware)</text>
    <line x1="450" y1="166" x2="450" y2="191" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow2)"/>

    <!-- 3 -->
    <rect x="150" y="193" width="600" height="42" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="450" y="219" fill="#e2e8f0" text-anchor="middle">3. Reject private / loopback / link-local / reserved / metadata IPs</text>
    <line x1="450" y1="235" x2="450" y2="260" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow2)"/>

    <!-- 4 -->
    <rect x="230" y="262" width="440" height="42" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="450" y="288" fill="#e2e8f0" text-anchor="middle">4. robots.txt fetch + policy evaluation (per origin)</text>
    <line x1="450" y1="304" x2="450" y2="329" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow2)"/>

    <!-- 5 -->
    <rect x="200" y="331" width="500" height="42" rx="8" fill="#1e293b" stroke="#f472b6" stroke-width="1.5"/>
    <text x="450" y="357" fill="#e2e8f0" text-anchor="middle">5. DNS-pinned GET request (no POST/PUT/PATCH/DELETE)</text>
    <line x1="450" y1="373" x2="450" y2="398" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow2)"/>

    <!-- 6 -->
    <rect x="150" y="400" width="600" height="42" rx="8" fill="#1e293b" stroke="#f472b6" stroke-width="1.5"/>
    <text x="450" y="426" fill="#e2e8f0" text-anchor="middle">6. Manual redirect follow (max 5 hops) — each hop re-validated from step 1</text>
    <line x1="450" y1="442" x2="450" y2="467" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow2)"/>

    <!-- 7 -->
    <rect x="230" y="469" width="440" height="42" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="450" y="495" fill="#e2e8f0" text-anchor="middle">7. Timeout + response-size + runtime-deadline bounds</text>
    <line x1="450" y1="511" x2="450" y2="536" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow2)"/>

    <!-- 8 -->
    <rect x="280" y="538" width="340" height="52" rx="8" fill="#052e1a" stroke="#4ade80" stroke-width="2"/>
    <text x="450" y="560" fill="#4ade80" text-anchor="middle" font-weight="700">Safe, Read-Only Audit</text>
    <text x="450" y="578" fill="#86efac" text-anchor="middle" font-size="11">Result recorded as evidence — page never modified</text>
  </g>

  <text x="450" y="615" fill="#64748b" text-anchor="middle" font-size="11">Any failed check halts the fetch and is recorded as evidence — fail closed, never fail open.</text>
</svg>
